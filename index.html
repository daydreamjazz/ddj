    <script>
  document.addEventListener('DOMContentLoaded', () => {
    const wrapper = document.getElementById('tiles-wrapper');
    const imgSrc = 'https://cdn.prod.website-files.com/6692bc2f85660c6b7c0c75f7/685d52e4bae5f80fe4760eb2_photo.webp';
    // Determine tile size based on screen width
    const screenWidth = window.innerWidth;
    const isMobile = screenWidth < 768;
    const isLargeScreen = screenWidth >= 1440;
    const tileSize = isLargeScreen ? 1800 : 1024;
    const extraCols = isMobile ? 6 : 18;
    const extraRows = isMobile ? 6 : 14;
    const wrapThreshold = isMobile ? 4 : 9;
    const cols = Math.ceil(screenWidth * 4 / tileSize) + extraCols;
    const rows = Math.ceil(window.innerHeight * 4 / tileSize) + extraRows;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const img = document.createElement('img');
        img.src = imgSrc;
        img.style.width = tileSize + 'px';
        img.style.height = tileSize + 'px';
        img.style.left = (x * tileSize) + 'px';
        img.style.top = (y * tileSize) + 'px';
        wrapper.appendChild(img);
      }
    }
    wrapper.style.width = (cols * tileSize) + 'px';
    wrapper.style.height = (rows * tileSize) + 'px';
    let offsetX = -tileSize * 2;
    let offsetY = -tileSize * 2;
    const speed = 5;
    function animate() {
      offsetX -= speed;
      offsetY -= speed;
      if (offsetX <= -tileSize * wrapThreshold) offsetX += tileSize * wrapThreshold;
      if (offsetY <= -tileSize * wrapThreshold) offsetY += tileSize * wrapThreshold;

    if (logo) {

      window.addEventListener('mousemove', (e) => {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const deltaX = (e.clientX - centerX) / centerX;
        const deltaY = (e.clientY - centerY) / centerY;
        const maxSkewX = 12;
        const maxSkewY = 12;
        const skewX = -deltaX * maxSkewX;
        const skewY = deltaY * maxSkewY;
        if (!animationFrameId) {
          animationFrameId = requestAnimationFrame(() => {
            logo.style.transform = `skewX(${skewX}deg) skewY(${skewY}deg)`;
            animationFrameId = null;
          });
        }
      });
      window.addEventListener('mouseleave', () => {
        logo.style.transition = 'transform 0.5s ease';
        logo.style.transform = 'skewX(0deg) skewY(0deg)';
        setTimeout(() => {
          logo.style.transition = '';
        }, 500);
      });
    }
  });
